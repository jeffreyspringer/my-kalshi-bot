name: Kalshi Weather Bot

on:
  schedule:
    # Run at minute 17 and 47 (Avoiding the :00 traffic jam)
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install -r requirements.txt
       
      - name: Run Bot
        env:
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }} 
        run: python -u bot.py

      - name: Commit Data & Logs
        run: |
          git config --global user.name "KalshiBot"
          git config --global user.email "bot@kalshi.com"
          
          # "git add ." stages ALL new or modified files automatically
          # This prevents the error if trade_log.csv doesn't exist yet
          git add .
          
          # Only commit if there are actually changes to save
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update logs and stats" && git push)
