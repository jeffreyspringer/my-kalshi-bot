name: Kalshi Weather Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # <--- REQUIRED for CSV Logging

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      
      - name: Run Bot
        env:
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Check for Kill Switch Variable (Optional, defaults to TRUE if missing)
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }} 
        run: python bot.py

      - name: Commit Trade Log
        run: |
          git config --global user.name "KalshiBot"
          git config --global user.email "bot@kalshi.com"
          git add trade_log.csv
          # Only commit if file changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trade log" && git push)
