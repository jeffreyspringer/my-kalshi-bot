name: Kalshi Weather Bot

on:
  schedule:
    # Runs at minute 0 of every hour (e.g., 10:00, 11:00, 12:00)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  trade:
    name: Run Trading Logic
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install the libraries listed in requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the bot with access to your Secrets
      - name: Run Bot
        env:
          # These must match the names in your GitHub Secrets exactly
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
