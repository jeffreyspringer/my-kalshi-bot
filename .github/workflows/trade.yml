name: Kalshi Debugger

on:
  workflow_dispatch: # Manual run only

jobs:
  debug_keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install requests cryptography

      - name: Create Multi-Env Debug Script
        run: |
          cat <<EOF > debug.py
          import os
          import base64
          import requests
          import time
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.serialization import load_pem_private_key

          # --- CONFIGURATION ---
          ENVIRONMENTS = [
              {"name": "🗳️ ELECTIONS (Legacy)", "host": "https://api.elections.kalshi.com"},
              {"name": "💰 PROD (Main)",      "host": "https://api.kalshi.com"},
              {"name": "🧪 DEMO (Play Money)", "host": "https://demo-api.kalshi.co"}
          ]

          def test_env(name, host, key_id, private_key):
              print(f"\nTesting {name} at {host}...")
              path = "/trade-api/v2/portfolio/balance"
              timestamp = str(int(time.time() * 1000))
              msg = f"{timestamp}GET{path}".encode('utf-8')
              
              try:
                  signature = private_key.sign(
                      msg,
                      padding.PSS(mgf=padding.MGF1(hashes.SHA256()), salt_length=padding.PSS.MAX_LENGTH),
                      hashes.SHA256()
                  )
                  sig_b64 = base64.b64encode(signature).decode('utf-8')
              except Exception as e:
                  print(f"❌ Signing Failed: {e}")
                  return False

              headers = {
                  "KALSHI-ACCESS-KEY": key_id,
                  "KALSHI-ACCESS-SIGNATURE": sig_b64,
                  "KALSHI-ACCESS-TIMESTAMP": timestamp,
                  "Content-Type": "application/json"
              }
              
              try:
                  res = requests.get(f"{host}{path}", headers=headers, timeout=5)
                  if res.status_code == 200:
                      print(f"✅ SUCCESS! Connected to {name}")
                      print(f"💰 Balance: {res.json().get('balance', '???')}")
                      return True
                  elif res.status_code == 401:
                      print(f"💀 401 Unauthorized (Keys rejected by {name})")
                  else:
                      print(f"⚠️ Status {res.status_code}: {res.text[:100]}")
              except Exception as e:
                  print(f"❌ Connection Failed: {e}")
              return False

          def main():
              print("🕵️ STARTING SKELETON KEY DIAGNOSTIC...")
              key_id = os.getenv("KALSHI_KEY", "").strip()
              priv_str = os.getenv("KALSHI_PRIVATE_KEY", "").strip()
              
              # Auto-Repair
              if "\\\\n" in priv_str: priv_str = priv_str.replace('\\\\n', '\\n')
              if "-----BEGIN" not in priv_str: 
                  priv_str = "-----BEGIN RSA PRIVATE KEY-----\\n" + priv_str + "\\n-----END RSA PRIVATE KEY-----"

              try:
                  private_key = load_pem_private_key(priv_str.encode(), password=None)
              except Exception as e:
                  print(f"❌ Key Load Failed: {e}")
                  return

              success = False
              for env in ENVIRONMENTS:
                  if test_env(env['name'], env['host'], key_id, private_key):
                      print(f"\n🎉 WINNER FOUND: Your keys belong to {env['name']}!")
                      print(f"👉 UPDATE bot.py TO USE HOST: {env['host']}/trade-api/v2")
                      success = True
                      break
              
              if not success:
                  print("\n❌ FAILURE: Keys were rejected by ALL environments.")
                  print("👉 FATAL: You likely generated keys on the WEBSITE but are using a different account type.")

          if __name__ == "__main__":
              main()
          EOF

      - name: Run Debug Script
        env:
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python debug.py
