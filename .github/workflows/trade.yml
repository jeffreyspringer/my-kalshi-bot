name: Kalshi Weather Bot

on:
  schedule:
    # Run at minute 17 and 47 of every hour to avoid GitHub traffic jams
    - cron: '17,47 * * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write  # Required to save trade_log.csv

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install -r requirements.txt
      
      - name: Run Bot
        env:
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Defaults to TRUE if you haven't set this variable yet
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }} 
        # The "-u" flag is CRITICAL. It forces logs to show up immediately.
        run: python -u bot.py

      - name: Commit Trade Log
        # This saves the CSV file back to your repo if a trade happened
        run: |
          git config --global user.name "KalshiBot"
          git config --global user.email "bot@kalshi.com"
          
          if [ -f trade_log.csv ]; then
            git add trade_log.csv
            # Only commit if file actually changed
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update trade log" && git push)
            echo "✅ Trade log updated."
          else
            echo "⚠️ No trade log found (no trades made). Skipping commit."
          fi
