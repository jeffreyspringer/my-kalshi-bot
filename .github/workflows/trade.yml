name: Kalshi Weather Bot

on:
  schedule:
    # Runs at minute 17 and 47 of every hour (e.g., 12:17, 12:47)
    # Using random "off-minutes" helps avoid GitHub's server delays.
    - cron: '17,47 * * * *'
  workflow_dispatch: # Allows you to force-run it manually

permissions:
  contents: write  # <--- REQUIRED for saving the trade_log.csv file

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install -r requirements.txt
      
      - name: Run Bot
        env:
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # The "Kill Switch" variable (Defaults to TRUE if not found)
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }} 
        run: python bot.py

      - name: Commit Trade Log
        # This step saves the 'trade_log.csv' back to your repository
        # It includes a check to ensure the file exists so it doesn't crash on the first run.
        run: |
          git config --global user.name "KalshiBot"
          git config --global user.email "bot@kalshi.com"
          
          if [ -f trade_log.csv ]; then
            git add trade_log.csv
            # Only commit if the file actually changed (to avoid empty commit errors)
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update trade log" && git push)
            echo "✅ Trade log updated."
          else
            echo "⚠️ No trade log found (no trades made). Skipping commit."
          fi
