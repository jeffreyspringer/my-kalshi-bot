name: Kalshi Weather Bot

on:
  schedule:
    # This runs the bot at 14:00 UTC (8:00 AM New Orleans time) 
    # and again at 18:00 UTC (12:00 PM New Orleans time).
    - cron: '0 14,18 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          # These must match your GitHub Secrets names exactly
          KALSHI_KEY: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python bot.py
