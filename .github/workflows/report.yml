name: Daily PnL Report

on:
  schedule:
    # Runs at 11 PM EST (which is 04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:  # Allows manual button press

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests cryptography matplotlib

      - name: Run CEO Report
        env:
          # We only need the Discord hook here, no Kalshi keys needed
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
        run: python report.py  # <--- CHANGED FROM bot.py
