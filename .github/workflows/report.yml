name: Daily PnL Report

on:
  schedule:
    # Runs at 1 AM EST (which is 06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual button press

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests cryptography matplotlib

      - name: Run CEO Report
        env:
          KALSHI_KEY: ${{ secrets.KALSHI_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          TRADING_ENABLED: "TRUE"
        run: python bot.py
